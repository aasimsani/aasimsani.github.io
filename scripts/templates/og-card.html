<style>
  * { margin: 0; box-sizing: border-box; }

  p { margin-top: 24px; font-size: 25px; line-height: 1.42; color: #bdb4cc; }

  .lines { position: absolute; left: 800px; top: 88px; }

  .handle { position: absolute; left: 974px; top: 314px; width: 40px; height: 6px; background: #ffb347;
    transform: rotate(45deg); transform-origin: left center; }
  .gorilla { position: absolute; left: 892px; top: 290px; font-size: 44px; }
